
# Infrabase - Main configuration

BB_NUMBER_THREADS = "20"

# Main target physical/emulated hardware

# IB_PLATFORM ?= "virt32"
IB_PLATFORM ?= "virt64"
# IB_PLATFORM ?= "rpi4_64"

# Linux General Configuration

# This configuration is used to start Linux alone, or on top AVZ
IB_CONFIG:linux:virt64 ?= "virt64_defconfig"

# IB_CONFIG:linux:rpi4_64 ?= "rpi4_64_defconfig"
IB_CONFIG:linux:rpi4_64 ?= "rpi4_64_nomodules_defconfig"

# Configuration to start Linux as agency to support SO3 capsules
# IB_CONFIG:linux:virt64 ?= "virt64_soo_defconfig"

PREFERRED_VERSION_linux:virt32 = "6.12"
PREFERRED_VERSION_linux:virt64 = "6.12"
PREFERRED_VERSION_linux:rpi4_64 = "6.12-rpi4"

# Preferred version for rootfs

# When the rootfs is fully built and user apps are deployed in it

PREFERRED_VERSION_rootfs-linux:virt64 = "1.0"
PREFERRED_VERSION_rootfs-linux:rpi4_64 = "1.0"

PREFERRED_VERSION_buildroot:virt64 = "2024.11"
PREFERRED_VERSION_buildroot:rpi4_64 = "2024.11"

# Main ITS configuration
IB_TARGET_ITS:linux:virt64 ?= "virt64"

# ITS used to run Linux on AVZ
# IB_TARGET_ITS:linux:virt64 ?= "virt64_avz"

# Preferred version for bsp

# To deploy from the host to the target via ssh/scp
PREFERRED_VERSION_bsp-linux:virt64 = "1.0"
PREFERRED_VERSION_bsp-linux:rpi4_64 = "1.0"

# U-boot bootloader
PREFERRED_VERSION_uboot:virt64 = "2022.04"
PREFERRED_VERSION_uboot:rpi4_64 = "2022.04"

PREFERRED_VERSION_usr-linux:virt64 = "1.0"
PREFERRED_VERSION_usr-linux:rpi4_64 = "1.0"

PREFERRED_VERSION_linux = "${PREFERRED_VERSION_linux:${IB_PLATFORM}}"

# *************** SO3 ***************

# Using the most recent version
PREFERRED_VERSION_so3:virt32 = "6.2.0"
PREFERRED_VERSION_so3:virt64 = "6.2.0"
PREFERRED_VERSION_so3:rpi4_64 = "6.2.0"

# Configuration for SO3
#
# SO3 follows the main IB_PLATFORM above — there is intentionally NO
# IB_PLATFORM:so3 override. The three SO3 contexts (standalone, guest on
# AVZ, and capsule) all run on the current platform; what distinguishes
# them is the CONFIG and the ITS below (IB_CONFIG:so3 / IB_TARGET_ITS:so3),
# not the platform. A divergent IB_PLATFORM:so3 used to silently build SO3
# for the wrong arch when it differed from IB_PLATFORM, so it was removed.

# IB_CONFIG:so3:virt64 ?= "virt64_defconfig"
# IB_CONFIG:so3:virt64 ?= "virt64_lvperf_defconfig"
# IB_CONFIG:so3:virt64 ?= "virt64_fb_defconfig"
IB_CONFIG:so3:virt32 ?= "virt32_fb_defconfig"

# SO3 guest under AVZ (EL1, fully-virtualized) — separate-ITB AVZ boot.
IB_CONFIG:so3:virt64 ?= "virt64_defconfig"
IB_CONFIG:so3:rpi4_64 ?= "rpi4_64_defconfig"

# Main ITS configuration
# IB_TARGET_ITS:so3:virt64 ?= "virt64_so3"
# This ITS enables running SO3 as a guest on top of the AVZ hypervisor.
# The AVZ hypervisor and the SO3 guest are TWO separate ITBs: the AVZ ITB
# (virt64_avz.its — hypervisor + avz_dt) and the SO3 guest ITB
# (virt64_so3_guest.its, derived as <its-without-_avz>_so3_guest), loaded
# together by U-Boot's e1c-boot command.
# Workflow: select it here, then `build.sh -x avz` (build the hypervisor),
# then deploy bsp-so3 (do_itb mkimage's both ITBs; usr-so3 populates the
# guest rootfs.fat).
IB_TARGET_ITS:so3:virt64  = "virt64_avz"

# This ITS is used to use SO3 as capsule
# IB_TARGET_ITS:so3:virt64  = "virt64_capsule"

IB_TARGET_ITS:so3:virt32 ?= "virt32_so3"
IB_TARGET_ITS:so3:rpi4_64 ?= "rpi4_64_so3"
# SO3 as an AVZ guest on RPi4 64-bit (two-ITB boot, like virt64):
# IB_TARGET_ITS:so3:rpi4_64 ?= "rpi4_64_avz"

 
# *************** AVZ ***************
# AVZ hypervisor General Configuration

PREFERRED_VERSION_avz:virt64 = "6.2.0"

# Configuration for AVZ
IB_CONFIG:avz:virt64 ?= "virt64_avz_defconfig"
# IB_CONFIG:avz:virt64 ?= "virt64_avz_soo_defconfig"

# *************** Boot chain ***************
#
# IB_BOOT_CHAIN selects how the platform firmware is brought up. It is set
# here as the SO3 default; a capsule layer may override it (edgem1 model:
# the e1c capsule sets it to "full"). Hence "?=" (weak) so the override
# wins. Values:
#   ""           bare U-Boot (virt64_defconfig), no ATF. SO3 standalone (EL1)
#                and SO3-on-AVZ without ATF — st.sh enables QEMU EL2
#                (virtualization=on) when the avz ITS is selected. SO3 default.
#   "uboot"      bare U-Boot, qemu_arm64_defconfig (EL1, position-independent):
#                the bare-Linux variant (kept for edgem1 alignment).
#   "atf+uboot"  ATF in flash0.img (BL1 + FIP[BL2+BL31+U-Boot]), no OP-TEE.
#   "full"       ATF + OP-TEE (BL32) + U-Boot in flash0.img — secure world.
# The flash0.img assembly lives in meta-bsp/.../bsp_virt64.inc
# (__do_platform_boot_chain); st.sh picks ATF vs bare from its presence.
IB_BOOT_CHAIN = ""

# ATF / OP-TEE platform identifiers for QEMU virt (used when IB_BOOT_CHAIN
# is "atf+uboot" or "full"). Mirrors edgem1's virt64 settings.
IB_ATF_PLAT:virt64 = "qemu"
IB_OPTEE_PLAT:virt64 = "vexpress-qemu_armv8a"
IB_ATF_EXTRA_OPTS:virt64 = "${@bb.utils.contains('IB_BOOT_CHAIN', 'full', 'SPD=opteed ', '', d)}LOG_LEVEL=40"

# *************** Verdin iMX8MP (SO3 guest on AVZ) ***************
# SO3 runs as an AVZ guest on the Toradex Verdin iMX8MP. The firmware chain is
# always ATF (EL3) + OP-TEE + U-Boot (the imx-boot/flash.bin), independent of
# Torizon and the e1c capsules. Select the board with IB_PLATFORM="verdin-imx8mp".
# AVZ + bundled u-boot + the imx8mp ATF/OP-TEE settings mirror edgem1's verdin
# build; the SO3 guest replaces the Linux guest. Two-ITB boot like virt64: the
# AVZ ITB (verdin_imx8mp_avz.its) and the SO3 guest ITB
# (verdin_imx8mp_so3_guest.its), loaded by U-Boot's e1c-boot command.
# SO3 as an AVZ guest (default). For SO3 standalone (bare-metal, no AVZ) select
# the standalone config + ITS, and build U-Boot with the EL1 switch so it hands
# SO3 off at EL1 (SO3 standalone is EL1-native; AVZ instead needs EL2):
#   IB_CONFIG:so3:verdin-imx8mp     ?= "verdin-imx8mp_defconfig"
#   IB_TARGET_ITS:so3:verdin-imx8mp ?= "verdin_imx8mp_so3"
#   IB_UBOOT_SWITCH_EL1 = "1"
IB_CONFIG:so3:verdin-imx8mp ?= "verdin-imx8mp_avz_defconfig"
IB_TARGET_ITS:so3:verdin-imx8mp ?= "verdin_imx8mp_avz"

# imx-boot's U-Boot hands the OS off at EL2 by default (AVZ). Set to "1" for the
# standalone variant so U-Boot switches to EL1 first (CONFIG_ARMV8_SWITCH_TO_EL1).
IB_UBOOT_SWITCH_EL1 ?= "0"

PREFERRED_VERSION_avz:verdin-imx8mp = "6.2.0"
IB_CONFIG:avz:verdin-imx8mp ?= "verdin-imx8mp_avz_defconfig"

# Verdin U-Boot 2024.07 assembles imx-boot/flash.bin (SPL + ATF + OP-TEE + U-Boot).
PREFERRED_VERSION_uboot:verdin-imx8mp = "2024.07"
# NXP lpddr4 DDR training firmware (vendored capsule-free, one flat directory).
IB_IMX_FIRMWARE_PATH = "${IB_DIR}/build/meta-bsp/recipes-bsp/bsp/verdin-imx8mp"

IB_PLAT_CPU:verdin-imx8mp = "aarch64"
IB_TOOLCHAIN:verdin-imx8mp = "aarch64-none-linux-gnu"

IB_ATF_PLAT:verdin-imx8mp = "imx8mp"
IB_ATF_EXTRA_OPTS:verdin-imx8mp = "IMX_BOOT_UART_BASE=0x30880000 SPD=opteed BL32_BASE=0xbe000000 BL32_SIZE=0x2000000 DEBUG=0 LOG_LEVEL=20"
IB_OPTEE_PLAT:verdin-imx8mp = "imx-mx8mpevk"
IB_OPTEE_EXTRA_OPTS:verdin-imx8mp = "CFG_TZDRAM_START=0xbe000000 CFG_DDR_SIZE=0x80000000 CFG_TEE_CORE_LOG_LEVEL=3 CFG_UART_BASE=0x30880000"

# Type of deployment (soft for virtual storage, hard for target hardware)

IB_STORAGE_MODE:virt64 ?= "soft"
IB_STORAGE_MODE:virt32 ?= "soft"
IB_STORAGE_MODE:rpi4_64 ?= "hard"
# Verdin: deploy the imx-boot + SO3 ITB via a TEZI image set (see bsp_verdin-imx8mp.inc)
IB_STORAGE_MODE:verdin-imx8mp ?= "http"
# IB_STORAGE_MODE ?= "remote"

# When deployed locally (for example on the PC where the build system is running)
# IB_STORAGE_MODE ?= "local"

# Possible hardware device for deployment
# !! BE VERY CAREFUL WITH THIS VARIABLE !!

IB_STORAGE_DEVICE:rpi4_64 = "mmcblk0"

# Size of the rootfs partition
IB_ROOTFS_SIZE ?= "2G"

# Target partition for the main rootfs

IB_ROOTFS_PARTITION:virt32 = "p2"
IB_ROOTFS_PARTITION:virt64 = "p2"
IB_ROOTFS_PARTITION:rpi4_64 = "p2"

IB_ROOTFS_PATH:linux = "${IB_DIR}/linux/rootfs"
IB_ROOTFS_PATH:so3 = "${IB_DIR}/so3/rootfs"

IB_ROOTFS_METHOD ?= "buildroot"
# IB_ROOTFS_METHOD ?= "debootstrap"

# CPU core and toolchain according to the platform

IB_PLAT_CPU:virt32 = "arm"

IB_PLAT_CPU:virt64 = "aarch64"
IB_PLAT_CPU:rpi4_64 = "aarch64"

IB_TOOLCHAIN:arm = "arm-linux-gnueabihf"
IB_TOOLCHAIN:virt64 = "aarch64-none-linux-gnu"
IB_TOOLCHAIN:rpi4_64 = "aarch64-none-linux-gnu"

# SO3 user-space MUSL cross toolchain, built by the musl-toolchain
# recipe (meta-toolchain) into the bitbake-managed build/tmp area.
# IB_MUSL_TARGET (selected per IB_PLAT_CPU below) names the
# sub-directory, e.g. ${IB_MUSL_TOOLCHAIN_DIR}/aarch64-linux-musl/bin.
# Only the toolchain for the configured arch is built.
IB_MUSL_TOOLCHAIN_DIR = "${TMPDIR}/toolchains"
IB_MUSL_TARGET:aarch64 = "aarch64-linux-musl"
IB_MUSL_TARGET:arm = "arm-linux-musleabihf"

# Debug options
# IB_USR_BUILD_TYPE = "Release"
IB_USR_BUILD_TYPE = "Debug"

# This will be used in the future
# ARM Trusted Firmware platform
# IB_ATF_PLAT = "imx8qx"

BB_NO_NETWORK_SANDBOX = "1"
BB_WARN_ONLY = "true"

# EXTRA_OVERRIDES enables fine-grained customization for the various IB recipes.
# EXTRA_OVERRIDES .= ":soo"
# :lvgl activates the lvgl bbappend which FETCHES lvgl (release/v9.3) into
# usr/lib/lvgl at build time  
EXTRA_OVERRIDES .= ":lvgl"
# EXTRA_OVERRIDES .= ":lvgl:soo"

