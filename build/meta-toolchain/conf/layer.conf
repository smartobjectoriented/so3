BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# append layer name to list of configured layers
BBFILE_COLLECTIONS += "toolchain"

LAYERSERIES_COMPAT_toolchain = "infrabase_core"
LAYERDEPENDS_toolchain = "toolchain"

# and use name as suffix for other properties
BBFILE_PATTERN_toolchain = "^${LAYERDIR}/"
BBFILE_PRIORITY_toolchain = "4"
